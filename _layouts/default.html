<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <script>
    if (!('onpagereveal' in window)) {
      document.documentElement.classList.add('page-transition-fallback');
      window.addEventListener('pageshow', function (event) {
        if (!event.persisted) return;
        document.documentElement.classList.remove('page-transition-fallback');
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          document.documentElement.classList.add('page-transition-fallback');
        }); });
      });
    }
  </script>
  <link rel="preload" href="{{ '/assets/fonts/inter-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/migeru.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body{% if page.layout == "post" and page.cover %} class="has-post-cover" style="--post-cover: url('{{ page.cover | relative_url | escape }}')"{% endif %}>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <div class="desktop-bar"><span class="desktop-apple" aria-hidden="true">✳</span><strong>migeru</strong><span>Un espacio personal</span></div>
  <div class="site-window">
    <div class="window-titlebar"><div class="window-lights" aria-hidden="true"><i></i><i></i><i></i></div><span class="window-title">migeru</span><span class="window-placeholder" aria-hidden="true"></span></div>
    <header class="site-header wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false"><g fill="currentColor"><ellipse cx="16" cy="7.3" rx="2.7" ry="5.2"/><ellipse cx="16" cy="24.7" rx="2.7" ry="5.2"/><ellipse cx="7.3" cy="16" rx="5.2" ry="2.7"/><ellipse cx="24.7" cy="16" rx="5.2" ry="2.7"/><ellipse cx="9.85" cy="9.85" rx="2.7" ry="5.2" transform="rotate(-45 9.85 9.85)"/><ellipse cx="22.15" cy="22.15" rx="2.7" ry="5.2" transform="rotate(-45 22.15 22.15)"/><ellipse cx="22.15" cy="9.85" rx="2.7" ry="5.2" transform="rotate(45 22.15 9.85)"/><ellipse cx="9.85" cy="22.15" rx="2.7" ry="5.2" transform="rotate(45 9.85 22.15)"/></g><circle cx="16" cy="16" r="4.3" fill="#e78031"/></svg></span><span>{{ site.title }}</span></a>
      <nav aria-label="Navegación principal"><div class="nav-segment"><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Inicio</a><a href="{{ '/sobre-mi/' | relative_url }}"{% if page.url == '/sobre-mi/' %} aria-current="page"{% endif %}>Sobre mí</a></div><a class="nav-contact" href="mailto:sirmigeru@hotmail.com">Escríbeme</a></nav>
    </header>
    <main id="contenido">{{ content }}</main>
    <footer class="site-footer wrap"><div><a class="brand footer-brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false"><g fill="currentColor"><ellipse cx="16" cy="7.3" rx="2.7" ry="5.2"/><ellipse cx="16" cy="24.7" rx="2.7" ry="5.2"/><ellipse cx="7.3" cy="16" rx="5.2" ry="2.7"/><ellipse cx="24.7" cy="16" rx="5.2" ry="2.7"/><ellipse cx="9.85" cy="9.85" rx="2.7" ry="5.2" transform="rotate(-45 9.85 9.85)"/><ellipse cx="22.15" cy="22.15" rx="2.7" ry="5.2" transform="rotate(-45 22.15 22.15)"/><ellipse cx="22.15" cy="9.85" rx="2.7" ry="5.2" transform="rotate(45 22.15 9.85)"/><ellipse cx="9.85" cy="22.15" rx="2.7" ry="5.2" transform="rotate(45 9.85 22.15)"/></g><circle cx="16" cy="16" r="4.3" fill="#e78031"/></svg></span><span>{{ site.title }}</span></a><p>Aquí guardo un poco de lo que veo y siento.</p></div><div class="footer-right"><a href="{{ '/feed.xml' | relative_url }}">RSS</a><span>© {{ 'now' | date: '%Y' }} {{ site.title }}</span></div></footer>
  </div>
  <script src="{{ '/assets/js/header.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/post-toc.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/media-focus.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/gallery.js' | relative_url }}" defer></script>
</body>
</html>
