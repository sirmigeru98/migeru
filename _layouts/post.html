---
layout: default
---
<article class="post-page wrap narrow">
  <a class="back-link" href="{{ '/' | relative_url }}">← Todos los artículos</a>
  <header class="post-header"><div class="eyebrow">{{ page.category | default: 'NOTAS' }} <span> / </span> {{ page.date | date: '%d.%m.%Y' }}</div><h1>{{ page.title }}</h1>{% if page.description %}<p class="post-lead">{{ page.description }}</p>{% endif %}</header>
  <div class="post-content">{% if page.cover %}<figure class="post-cover"><img src="{{ page.cover | relative_url }}" alt="{{ page.cover_alt | default: page.title | escape }}" fetchpriority="high" decoding="async"></figure>{% endif %}{{ content }}</div>
  <div class="post-end">Gracias por acompañarme hasta aquí <span>✳</span></div>
</article>
